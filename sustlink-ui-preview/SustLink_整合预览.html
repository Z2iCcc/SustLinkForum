all>你的日常，也会成为别人的灵感</small></div><button data-action="nav" data-page="publish">去记录</button></div>`:'<div style="height:12px"></div>'}${filtered.length?grid(filtered,profileTab==='闲置'):empty(profileTab==='收藏'?'还没有收藏的笔记':`还没有${profileTab}内容`,profileTab==='收藏'?'打开笔记，点击星星就能收藏。':'去首页逛逛，或记录你的第一条内容。')}</section></div>`}
function renderSearch(){let list=posts.filter(p=>(p.title+p.body+p.tag+p.author).toLowerCase().includes(query.toLowerCase())&&(searchScope!=='mine'||p.mine)&&(searchScope!=='market'||p.tag==='闲置'));return `<header class="topbar">${btn('back','返回','back')}<form class="search-form" id="search-form"><div class="search-field">${icon('search')}<input type="search" id="search-input" aria-label="搜索关键词" placeholder="${searchScope==='mine'?'搜索我的内容':searchScope==='market'?'搜索校园闲置':'搜索校园里的新鲜事'}" value="${esc(query)}" autocomplete="off" enterkeyhint="search"><button class="clear" type="button" data-action="clear-query" aria-label="清空关键词">×</button></div><button type="submit" class="text-button">搜索</button></form></header><div class="scroll">${searchMode?`<div class="results-label">${esc(query)} · 找到 ${list.length} 条${searchScope==='mine'?'我的':''}内容</div><div class="feed">${grid(list,searchScope==='market')}</div>`:`<section class="section"><div class="section-head"><h2>最近搜索</h2>${btn('trash','清空搜索记录','clear-history')}</div><div class="pills">${historySearch.length?historySearch.map(t=>`<button class="pill" data-action="search-word" data-value="${esc(t)}">${esc(t)}</button>`).join(''):'<p class="muted" style="font-size:13px">搜索过的内容会出现在这里</p>'}</div></section><section class="section"><div class="section-head"><h2>校园都在搜</h2><small class="muted">探索灵感</small></div><div class="discover-list">${['校园','美食','学习搭子','自习','社团','闲置'].map((t,i)=>`<button class="discover-item" data-action="search-word" data-value="${t}"><b>${i+1}</b>${t}${i===1?'<em>热</em>':''}</button>`).join('')}</div></section><button class="search-ai" data-action="nav" data-page="ai">${aiMark()}<span class="spacer"><strong>问题太具体？问问校园 AI</strong><small>学习计划、搭子灵感、校园生活</small></span>${icon('chevron')}</button>`}</div>`}
function renderAI(){return `<header class="topbar">${btn('close','关闭校园 AI','back')}<div class="title-center ai-title">${aiMark()}<strong>校园 AI</strong></div>${btn('more','AI 会话选项','ai-menu')}</header><div class="scroll" id="chat-scroll">${aiMessages.length?`<div class="chat-log">${aiMessages.map(m=>`<div class="bubble ${m.role}">${m.role==='assistant'?'<strong>给你一点校园灵感</strong>':''}${esc(m.text)}${m.role==='assistant'?'<small>预设演示回答 · 未连接 AI 服务</small>':''}</div>`).join('')}</div>`:`<div class="ai-welcome">${aiMark()}<h1>嗨，今天想探索什么？</h1><p>从第一节早八，到晚风里的操场。<br>关于校园的小问题，一起想想。</p></div><div class="suggestions">${[['book','帮我安排一周自习计划','给努力留一点从容'],['coffee','校园美食怎么找？','发现下一顿的小惊喜'],['users','我想找一个运动搭子','把一个人的坚持，变成两个人的约定']].map(([ic,t,s])=>`<button class="suggestion" data-action="ai-prompt" data-value="${t}">${icon(ic)}<span class="spacer">${t}<small>${s}</small></span>${icon('chevron')}</button>`).join('')}</div>`}</div><div class="chat-compose"><form class="compose-box" id="ai-form"><textarea id="ai-input" rows="1" maxlength="500" aria-label="给校园 AI 的问题" placeholder="聊聊你的校园生活…" enterkeyhint="send"></textarea><button class="icon-btn" aria-label="发送给校园 AI" type="submit">${icon('arrow')}</button></form><p class="demo-caption">交互演示 · 预设回答，不代表学校官方信息</p></div>`}
function renderDetail(){const p=posts.find(p=>p.id===route.id);if(!p)return pageBar('内容不存在')+empty();const cs=comments[p.id]||[];return `<header class="topbar">${btn('back','返回列表','back')}<button class="author" data-action="author" data-id="${p.id}"><span class="avatar" style="width:32px;height:32px">${esc((p.mine?profile.name:p.author).slice(0,1))}</span><span style="font-size:13px">${esc(p.mine?profile.name:p.author)}</span></button>${btn('share','分享笔记','share-post')}</header><div class="scroll"><div class="detail-cover">${cover(p)}</div><article class="detail-text"><h1>${esc(p.title)}</h1>${p.price!==undefined?`<div class="price" style="padding:0 0 12px">¥${p.price}<small>演示商品 · 无真实交易</small></div>`:''}<p>${esc(p.body)}</p><div class="detail-tags">#${esc(p.tag)}　#陕科大　#校园生活</div><div class="detail-time">${p.local?'刚刚发布':'09-06'} · 陕西 · 示例内容</div></article><section class="comments"><h3>评论 · ${cs.length}</h3>${cs.length?cs.map(t=>`<div class="comment"><span class="avatar">${esc(profile.name.slice(0,1))}</span><div><small>${esc(profile.name)} · 刚刚</small><p>${esc(t)}</p></div></div>`).join(''):'<p class="muted" style="font-size:12px;padding:18px 0">聊聊你的想法，做第一个留言的人。</p>'}</section></div><footer class="detail-actions"><button class="comment-prompt" data-action="comment">说点什么吧…</button><button class="like ${likes.has(p.id)?'selected':''}" data-action="like" data-id="${p.id}" aria-label="${likes.has(p.id)?'取消点赞':'点赞'}" aria-pressed="${likes.has(p.id)}">${icon('heart')}<span>${p.likes+(likes.has(p.id)?1:0)}</span></button><button class="icon-btn save ${saves.has(p.id)?'selected':''}" data-action="save" data-id="${p.id}" aria-label="${saves.has(p.id)?'取消收藏':'收藏笔记'}" aria-pressed="${saves.has(p.id)}">${icon('star')}</button></footer>`}
const conversations=[{id:'study',name:'图书馆自习搭子',initial:'习',text:'明天也一起去图书馆吗？',time:'10:24'},{id:'market',name:'小林同学',initial:'林',text:'台灯还在，周末可以校内自提。',time:'昨天'}];
function renderMessages(){return `<header class="topbar"><h1 style="padding-left:12px">消息</h1><span class="spacer"></span><span class="muted" style="font-size:11px;padding:0 12px">本地演示</span></header><div class="scroll"><div class="message-actions">${[['heart','赞和收藏'],['users','新增关注'],['chat','评论和提及']].map(([ic,t])=>`<button class="message-action" data-action="notice" data-value="${t}"><span>${icon(ic)}</span>${t}</button>`).join('')}</div><button class="list-row" data-action="nav" data-page="ai"><span class="avatar" style="background:#e4efff;color:#3278bd">${icon('spark')}</span><span class="row-body"><strong>校园 AI</strong><small>有校园问题？来这里聊聊</small></span>${icon('chevron')}</button>${conversations.map(c=>`<button class="list-row" data-action="chat" data-value="${c.id}"><span class="avatar">${c.initial}</span><span class="row-body"><strong>${c.name}</strong><small>${esc(chatMessages[c.id]?.at(-1)?.text||c.text)}</small></span><time>${c.time}</time></button>`).join('')}</div>`}
function renderChat(){const c=conversations.find(c=>c.id===route.id)||conversations[0];const log=chatMessages[c.id]||[];return `${pageBar(c.name)}<div class="scroll" id="chat-scroll" style="background:var(--canvas)"><p class="chat-date">本地消息演示 · 不会发送给真实用户</p><div class="chat-log"><div class="bubble assistant">${c.text}</div>${log.map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join('')}</div></div><div class="chat-compose"><form id="message-form" class="compose-box"><textarea id="message-input" rows="1" maxlength="500" aria-label="消息内容" placeholder="发一条消息…"></textarea><button type="submit" class="icon-btn" aria-label="发送消息">${icon('send')}</button></form></div>`}
let publishDraft={title:'',body:'',tag:'校园',price:''};
function renderPublish(){return `${pageBar('记录校园生活',btn('close','关闭发布','back'))}<div class="scroll"><form id="publish-form" class="editor"><label class="upload" for="photo-input" style="margin:0;cursor:pointer">${publishImage?`<img src="${publishImage}" alt="待发布图片预览">`:`${icon('image')}<span>添加照片，让日常更生动</span><small>可选 · JPG / PNG / WebP · 2 MB 内</small>`}</label><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" style="width:100%;margin-top:10px;font-size:12px" aria-label="选择发布图片"><label for="post-title">标题</label><input id="post-title" maxlength="60" required placeholder="给这段日常起个名字"><label for="post-body">正文</label><textarea id="post-body" maxlength="2000" required placeholder="分享你的发现、心情，或者想找的搭子…">${esc(publishDraft.body)}</textarea><label for="post-tag">发布到</label><select id="post-tag">${['校园','学习','美食','搭子','运动','社团','旅行','闲置'].map(t=>`<option ${t===publishDraft.tag?'selected':''}>${t}</option>`).join('')}</select><div id="price-field" ${publishDraft.tag==='闲置'?'':'hidden'}><label for="post-price">价格（元）</label><input id="post-price" type="number" min="0" max="99999" step="0.01" value="${esc(publishDraft.price)}" placeholder="0 表示免费赠送"></div><div class="form-alert error-text" id="publish-error" role="alert"></div><button class="primary" type="submit">发布到我的校园</button><p class="muted" style="margin-top:12px;text-align:center">发布仅保存到本浏览器，不上传服务器</p></form></div>`}
function renderEdit(){return `${pageBar('编辑资料')}<div class="scroll"><form id="edit-form" class="editor"><div class="big-avatar" style="margin:8px auto 24px">${avatarSvg}</div><label for="profile-name">昵称</label><input id="profile-name" maxlength="16" value="${esc(profile.name)}" required><label for="profile-bio">个人简介</label><textarea id="profile-bio" maxlength="160">${esc(profile.bio)}</textarea><p class="muted" style="margin-top:12px">让同校的朋友更了解你。资料仅保存在当前浏览器。</p><div id="edit-error" class="error-text" role="alert"></div><button type="submit" class="primary">保存资料</button></form></div>`}
function renderCollection(){const list=route.kind==='history'?browsed.map(id=>posts.find(p=>p.id===id)).filter(Boolean):posts.filter(p=>p.mine&&p.tag==='闲置');return `${pageBar(route.kind==='history'?'浏览记录':'我的闲置')}<div class="scroll feed">${list.length?grid(list,route.kind==='market'):empty('这里还空着',route.kind==='history'?'打开一篇笔记后，会在这里留下足迹。':'发布闲置时选择“闲置”分类，就能在这里管理。')}</div>`}
function modal(title,body,actions='<button class="primary" data-action="close-sheet">知道了</button>'){returnFocus=document.activeElement;sheet.innerHTML=`<h2 id="sheet-title">${title}</h2>${body}<div class="dialog-actions">${actions}</div>`;sheet.showModal()}
sheet.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
function submitSearch(value){query=value.trim().slice(0,100);if(!query){toast('输入一个关键词再搜索吧');return}historySearch=[query,...historySearch.filter(t=>t!==query)].slice(0,8);persist();searchMode=true;scrollPositions.search=0;render()}
function scrollChat(){requestAnimationFrame(()=>{const el=document.getElementById('chat-scroll');if(el)el.scrollTop=el.scrollHeight})}
function answerAI(text){if(!text.trim())return;const t=text.trim().slice(0,500);let answer=t.match(/吃|美食|食堂/)?'可以先从「美食」分类看看同学的分享，再按照距离、预算和口味筛选。\n\n试试搜索「食堂」或「美食」，收藏想吃的内容，和朋友一起慢慢打卡。\n\n具体营业时间和菜单请向食堂确认。':t.match(/搭子|运动|跑步/)?'找搭子时，把这几件事写清楚会更容易遇到合拍的人：\n\n① 想做什么，比如夜跑或一起自习。\n② 方便的时间与地点。\n③ 希望的节奏，例如每周两次、轻松坚持。\n\n可以到发布页选择「搭子」，写一条简短的招募。':'可以先试一个轻量的一周安排：\n\n周一到周四：每天选一个最重要的任务，专注两个 45 分钟。\n周五：整理本周笔记，标出还没弄懂的问题。\n周末：用半天补缺，剩下的时间运动、休息。\n\n把计划留一点空白，比排得满满当当更容易坚持。';aiMessages.push({role:'user',text:t},{role:'assistant',text:answer});render();scrollChat()}
function toggleLike(id){likes.has(id)?likes.delete(id):likes.add(id);persist();document.querySelectorAll(`[data-action="like"][data-id="${id}"]`).forEach(el=>{const p=posts.find(p=>p.id===id);el.classList.toggle('selected',likes.has(id));el.setAttribute('aria-pressed',String(likes.has(id)));el.setAttribute('aria-label',likes.has(id)?'取消点赞':'点赞');el.querySelector('span').textContent=p.likes+(likes.has(id)?1:0)})}
async function share(){const text=route.page==='detail'?`SustLink · ${posts.find(p=>p.id===route.id).title}`:`SustLink · ${profile.name}的校园主页`;try{await navigator.clipboard.writeText(text);toast('分享文案已复制')}catch{modal('分享文案',`<p>${esc(text)}</p><p>这是本地原型，尚无可公开访问的内容链接。</p>`)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=Number(b.dataset.id),v=b.dataset.value;switch(a){case 'nav':if(b.dataset.page==='search'){query='';searchMode=false}navigate(b.dataset.page,{},true);break;case 'back':back();break;case 'home-tab':homeTab=v;scrollPositions.home=0;render();break;case 'category':category=v;scrollPositions.home=0;render();break;case 'market-category':marketCategory=v;render();break;case 'profile-tab':rememberScroll();profileTab=v;render();break;case 'search':case 'market-search':case 'profile-search':query='';searchMode=false;searchScope=a==='profile-search'?'mine':a==='market-search'?'market':'all';navigate('search');break;case 'search-word':submitSearch(v);break;case 'clear-query':query='';searchMode=false;render();document.getElementById('search-input').focus();break;case 'clear-history':modal('清空最近搜索？','<p>清空后，搜索记录无法恢复。</p>','<button class="secondary" data-action="close-sheet">取消</button><button class="primary" data-action="confirm-history">清空记录</button>');break;case 'confirm-history':historySearch=[];persist();sheet.close();render();break;case 'post':browsed=[id,...browsed.filter(n=>n!==id)].slice(0,30);persist();navigate('detail',{id});break;case 'like':toggleLike(id);break;case 'save':saves.has(id)?saves.delete(id):saves.add(id);persist();rememberScroll();render();toast(saves.has(id)?'已收藏，可在「我的 → 收藏」查看':'已取消收藏');break;case 'author':{const p=posts.find(p=>p.id===id);if(p.mine)navigate('profile');else modal(esc(p.author),`<p>陕科大 · 校园生活分享者</p><p>这是示例用户。正式 App 中，这里将进入该用户的完整主页。</p>`);break}case 'ai-prompt':answerAI(v);break;case 'ai-menu':modal('校园 AI','<p>当前为预设回答演示，未连接大模型服务。</p>','<button class="secondary" data-action="close-sheet">返回</button><button class="primary" data-action="clear-ai">新建对话</button>');break;case 'clear-ai':aiMessages=[];sheet.close();render();break;case 'chat':navigate('chat',{id:v});break;case 'collection':navigate('collection',{kind:v});break;case 'notice':modal(v,'<p>还没有新的通知。真实通知将在接入服务端后同步。</p>');break;case 'stat':modal(v,'<p>这里展示的是原型示例统计，未连接真实用户关系数据。</p>');break;case 'profile-menu':modal('我的校园',`<button class="menu-choice" data-action="nav" data-page="edit">${icon('edit')}编辑个人资料</button><button class="menu-choice" data-action="collection" data-value="history">${icon('clock')}浏览记录</button><button class="menu-choice" data-action="about">${icon('book')}关于这个原型</button>`,'<button class="secondary" data-action="close-sheet">关闭</button>');break;case 'about':sheet.close();modal('SustLink 交互原型','<p>根据首页与个人页手绘稿整合。\n\n点赞、收藏、个人资料、搜索记录和发布内容保存在本浏览器。AI 与消息为演示，不会发送给他人。\n\n示意配图来自 Unsplash，非真实校园实拍。</p>');break;case 'share-profile':case 'share-post':share();break;case 'close-sheet':sheet.close();break;case 'comment':modal('写下你的评论','<textarea id="comment-input" aria-label="评论内容" maxlength="300" placeholder="友善交流，让校园更温暖"></textarea><p id="comment-error" class="error-text" role="alert"></p>','<button class="secondary" data-action="close-sheet">取消</button><button class="primary" data-action="submit-comment">发布评论</button>');break;case 'submit-comment':{const text=document.getElementById('comment-input').value.trim();if(!text){document.getElementById('comment-error').textContent='请先写下评论内容';return}comments[route.id]=[...(comments[route.id]||[]),text];persist();sheet.close();rememberScroll();render();toast('评论已保存到本浏览器');break}}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='search-form')submitSearch(document.getElementById('search-input').value);if(e.target.id==='ai-form')answerAI(document.getElementById('ai-input').value);if(e.target.id==='message-form'){const el=document.getElementById('message-input');if(!el.value.trim())return;chatMessages[route.id]=[...(chatMessages[route.id]||[]),{role:'user',text:el.value.trim()},{role:'assistant',text:'【演示回复】收到啦！这条回复由本地原型生成，没有发送给真实用户。'}];render()}if(e.target.id==='edit-form'){const name=document.getElementById('profile-name').value.trim();if(!name){document.getElementById('edit-error').textContent='昵称不能只有空格';return}profile={name,bio:document.getElementById('profile-bio').value.trim()};persist();back();toast('资料已保存')}if(e.target.id==='publish-form'){captureDraft();if(!publishDraft.title.trim()||!publishDraft.body.trim()){document.getElementById('publish-error').textContent='请填写标题和正文，不能只有空格。';return}if(publishDraft.tag==='闲置'&&(publishDraft.price===''||Number(publishDraft.price)<0||Number(publishDraft.price)>99999)){document.getElementById('publish-error').textContent='请填写 0–99999 元之间的价格。';return}posts.unshift({id:Date.now(),title:publishDraft.title.trim(),body:publishDraft.body.trim(),tag:publishDraft.tag,price:publishDraft.tag==='闲置'?Number(publishDraft.price):undefined,author:profile.name,likes:0,mine:true,local:true,image:publishImage||undefined,poster:publishImage?undefined:'schedule',headline:esc(publishDraft.title.trim()),eyebrow:'MY CAMPUS NOTE',foot:'记录我的校园生活',ratio:.9});persist();publishDraft={title:'',body:'',tag:'校园',price:''};publishImage='';profileTab='笔记';navigate('profile');toast('发布成功，内容仅保存在本浏览器')}});
function captureDraft(){if(!document.getElementById('post-title'))return;publishDraft={title:document.getElementById('post-title').value,body:document.getElementById('post-body').value,tag:document.getElementById('post-tag').value,price:document.getElementById('post-price').value}}
document.addEventListener('input',e=>{if(e.target.closest('#publish-form'))captureDraft();if(e.target.tagName==='TEXTAREA'&&e.target.closest('.compose-box')){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px'}});
document.addEventListener('change',e=>{if(e.target.id==='post-tag'){captureDraft();document.getElementById('price-field').hidden=e.target.value!=='闲置'}if(e.target.id==='photo-input'){const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2*1024*1024){toast('请选择 2 MB 内的 JPG、PNG 或 WebP 图片');e.target.value='';return}captureDraft();const reader=new FileReader();reader.onload=()=>{publishImage=reader.result;if(route.page==='publish')render()};reader.readAsDataURL(file)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.matches('#ai-input,#message-input')){e.preventDefault();e.target.closest('form').requestSubmit()}if(e.key==='Escape'&&!sheet.open&&routeStack.length)back()});
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--preview-width',b.dataset.width+'px');document.querySelectorAll('[data-width]').forEach(el=>el.classList.toggle('active',el===b))}));
window.addEventListener('popstate',e=>{rememberScroll();if(sheet.open)sheet.close();route=e.state?.route||{page:'home'};routeStack=e.state?.stack||[];render();screen.focus({preventScroll:true})});
// 移动端软键盘弹出时跟随可见视口，输入区保持可见。
function fitViewport(){if(window.visualViewport&&innerWidth<=600)document.getElementById('app').style.height=window.visualViewport.height+'px';else document.getElementById('app').style.height=''}
window.visualViewport?.addEventListener('resize',fitViewport);window.addEventListener('resize',fitViewport);fitViewport();
const firstPage=location.hash.slice(1);if(['home','profile','market','messages','search','ai'].includes(firstPage))route={page:firstPage};window.history.replaceState({route,stack:[]},'','#'+route.page);render();
</script>
</body>
